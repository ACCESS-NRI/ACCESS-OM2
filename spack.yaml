# This is a Spack Environment file.
#
# It describes a set of packages to be installed, along with
# configuration settings.
spack:
  definitions:
  # _name and _version are reserved definitions that inform deployments
  - _name: [access-om2]
  - _version: [2026.08.000]
  # _spack-version and _custom-scopes inform the branch of spack to use, and custom scopes if applicable, respectively
  - _spack-version: ["1.1"]
  # Release database provenance information - packages for inclusion into the database, and packages just for injection into the modules
  - _provenance: ["mom5", "cice5", "oasis3-mct", "libaccessom2"]
  - _injection: []
  # add package specs to the `specs` list
  specs:
  - access-om2
  packages:
    # Direct dependencies
    cice5:
      require:
      - '@git.345d1fba9ab4b7c01aa556f310094c7831e931f3'
      - 'io_type=PIO build_system=cmake'
    mom5:
      require:
      - '@2026.02.001'
    libaccessom2:
      require:
      - '@2026.08.000'
    oasis3-mct:
      require:
      - '@2025.03.001'

    # Indirect dependencies
    netcdf-c:
      require:
      - '@4.9.2'
    netcdf-fortran:
      require:
      - '@4.6.1'
    parallelio:
      require:
      - '@2.6.8'
    openmpi:
      require:
      - '@5.0.8'
    access-fms:
      require:
      - '@2025.08.001'
      - 'cppflags="-DMAXFIELDMETHODS_=600"'
    access-generic-tracers:
      require:
      - '@2026.05.000'
    access-mocsy:
      require:
      - '@2025.07.002'
    c:
      require:
      - 'intel-oneapi-compilers@2025.2.0'
    cxx:
      require:
      - 'intel-oneapi-compilers@2025.2.0'
    fortran:
      require:
      - 'intel-oneapi-compilers@2025.2.0'
    all:
      prefer:
      - 'target=x86_64_v4'
  view: true
  concretizer:
    unify: true
  repos:
    access_spack_packages:
      git: https://github.com/ACCESS-NRI/access-spack-packages.git
      tag: 2026.08.011
      destination: $env/package-repos/access-spack-packages
